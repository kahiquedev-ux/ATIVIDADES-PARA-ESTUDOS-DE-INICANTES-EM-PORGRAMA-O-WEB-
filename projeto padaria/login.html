<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sabor Divino Padaria</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fefaf5 0%, #fff0e0 100%);
  min-height: 100vh;
  overflow-x: hidden;
}

.login-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 100px 20px 40px;
}

.login-container {
  background: white;
  border-radius: 30px;
  box-shadow: 0 25px 50px rgba(139,69,19,0.15);
  overflow: hidden;
  max-width: 450px;
  width: 100%;
  animation: fadeInUp 0.6s ease;
}

.login-header {
  background: linear-gradient(135deg, #8B4513, #D2691E);
  padding: 40px 30px;
  text-align: center;
  position: relative;
}

.login-header::before {
  content: '';
  position: absolute;
  bottom: -20px;
  left: 0;
  right: 0;
  height: 40px;
  background: white;
  border-radius: 50% 50% 0 0;
}

.login-header img {
  height: 70px;
  margin-bottom: 15px;
  filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
}

.login-header h2 {
  color: white;
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  margin-bottom: 5px;
}

.login-header p {
  color: rgba(255,255,255,0.9);
  font-size: 0.9rem;
}

.login-body {
  padding: 40px 30px;
}

.form-group {
  margin-bottom: 25px;
  position: relative;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: 600;
  color: #8B4513;
  font-size: 0.9rem;
}

.form-group .input-icon {
  position: relative;
}

.form-group .input-icon i {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: #D2691E;
  font-size: 1.1rem;
}

.form-control {
  width: 100%;
  padding: 14px 15px 14px 45px;
  border: 2px solid #f0e0d0;
  border-radius: 15px;
  font-size: 1rem;
  transition: all 0.3s;
  background: #fffaf5;
}

.form-control:focus {
  outline: none;
  border-color: #D2691E;
  box-shadow: 0 0 0 3px rgba(210,105,30,0.1);
}

.btn-login {
  width: 100%;
  background: linear-gradient(135deg, #8B4513, #D2691E);
  border: none;
  padding: 14px;
  color: white;
  font-weight: 700;
  font-size: 1.1rem;
  border-radius: 15px;
  cursor: pointer;
  transition: all 0.3s;
  margin-top: 10px;
}

.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(139,69,19,0.3);
}

.register-link {
  text-align: center;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #f0e0d0;
}

.register-link a {
  color: #D2691E;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s;
}

.register-link a:hover {
  color: #8B4513;
  text-decoration: underline;
}

.back-home {
  text-align: center;
  margin-top: 15px;
}

.back-home a {
  color: #999;
  text-decoration: none;
  font-size: 0.9rem;
  transition: all 0.3s;
}

.back-home a:hover {
  color: #D2691E;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 480px) {
  .login-body {
    padding: 30px 20px;
  }
  .login-header {
    padding: 30px 20px;
  }
  .login-header img {
    height: 50px;
  }
}
</style>
</head>
<body>

<!-- NAVBAR SIMPLES -->
<nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background: white !important; box-shadow: 0 2px 15px rgba(0,0,0,0.05);">
<div class="container">
<a class="navbar-brand" href="index.html">
<img src="./img/logo.png" alt="Logo" height="40" class="me-2">
<span style="font-family: 'Playfair Display', serif; font-weight: 700; color: #8B4513;">Sabor Divino</span>
</a>
<a href="index.html" class="btn btn-outline-secondary btn-sm">← Voltar</a>
</div>
</nav>

<div class="login-wrapper">
<div class="login-container">
<div class="login-header">
<img src="./img/logo.png" alt="Logo">
<h2>Bem-vindo de volta! 🍞</h2>
<p>Faça login para continuar</p>
</div>

<div class="login-body">
<form id="loginForm">
<div class="form-group">
<label>Usuário ou Email</label>
<div class="input-icon">
<i class="fas fa-user"></i>
<input type="text" class="form-control" id="username" placeholder="Digite seu usuário" required>
</div>
</div>

<div class="form-group">
<label>Senha</label>
<div class="input-icon">
<i class="fas fa-lock"></i>
<input type="password" class="form-control" id="password" placeholder="Digite sua senha" required>
</div>
</div>

<button type="submit" class="btn-login">
<i class="fas fa-sign-in-alt me-2"></i> Entrar na Conta
</button>

<div id="loginMessage" class="mt-3 text-center" style="font-size: 0.9rem;"></div>
</form>

<div class="register-link">
<a href="cadastro.html">
<i class="fas fa-user-plus me-1"></i> Não tem conta? Cadastre-se
</a>
</div>

<div class="back-home">
<a href="index.html">
<i class="fas fa-arrow-left me-1"></i> Voltar para a loja
</a>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// FUNÇÃO DE LOGIN COMPLETA
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const loginMessage = document.getElementById('loginMessage');
  
  // Verificar se é o admin
  if (username === 'admin' && password === 'admin123') {
    localStorage.setItem('loggedIn', 'true');
    localStorage.setItem('userRole', 'admin');
    localStorage.setItem('userName', 'Administrador');
    
    Swal.fire({
      icon: 'success',
      title: 'Login realizado!',
      text: 'Bem-vindo, Administrador!',
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = 'admin.html';
    });
    return;
  }
  
  // Buscar usuários cadastrados
  const users = JSON.parse(localStorage.getItem('padariaUsers')) || [];
  const foundUser = users.find(user => 
    (user.username === username || user.email === username) && user.password === password
  );
  
  if (foundUser) {
    localStorage.setItem('loggedIn', 'true');
    localStorage.setItem('userRole', 'user');
    localStorage.setItem('userName', foundUser.nome);
    localStorage.setItem('userEmail', foundUser.email);
    
    Swal.fire({
      icon: 'success',
      title: 'Login realizado!',
      text: `Bem-vindo de volta, ${foundUser.nome}!`,
      timer: 1500,
      showConfirmButton: false
    }).then(() => {
      window.location.href = 'index.html';
    });
  } else {
    loginMessage.innerHTML = '<span style="color: #dc3545;"><i class="fas fa-exclamation-circle"></i> Usuário ou senha incorretos!</span>';
    
    Swal.fire({
      icon: 'error',
      title: 'Erro!',
      text: 'Usuário ou senha incorretos. Verifique seus dados.',
      confirmButtonColor: '#D2691E'
    });
  }
});

// Verificar se já está logado
if (localStorage.getItem('loggedIn') === 'true') {
  Swal.fire({
    icon: 'info',
    title: 'Você já está logado!',
    text: 'Redirecionando para a página inicial...',
    timer: 1500,
    showConfirmButton: false
  }).then(() => {
    window.location.href = 'index.html';
  });
}
</script>

</body>
</html>
