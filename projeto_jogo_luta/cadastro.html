<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Arena dos Campeões</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
  background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
  font-family: 'Orbitron', monospace;
  min-height: 100vh;
}
.register-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.register-card {
  background: rgba(26,26,46,0.95);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 10px 40px rgba(255,0,0,0.3);
  border: 1px solid #ff0000;
  width: 100%;
  max-width: 500px;
}
.register-card h2 {
  color: #ff0000;
  text-align: center;
  margin-bottom: 30px;
  font-weight: bold;
}
.form-control {
  background: #2a2a3e;
  border: 1px solid #ff0000;
  color: white;
  padding: 12px;
}
.form-control:focus {
  background: #3a3a5e;
  color: white;
  border-color: #ff4444;
}
.btn-register {
  background: linear-gradient(90deg, #ff0000, #cc0000);
  border: none;
  padding: 12px;
  font-weight: bold;
  text-transform: uppercase;
  width: 100%;
}
.btn-register:hover {
  transform: scale(1.02);
  box-shadow: 0 5px 20px rgba(255,0,0,0.4);
}
</style>
</head>
<body>
<div class="register-container">
  <div class="register-card">
    <h2><i class="fas fa-user-plus"></i> Cadastre-se</h2>
    <form id="cadastroForm">
      <div class="mb-3">
        <label class="form-label text-white">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Usuário</label>
        <input type="text" class="form-control" id="newUsername" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Senha</label>
        <input type="password" class="form-control" id="newPassword" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-white">Confirmar Senha</label>
        <input type="password" class="form-control" id="confirmPassword" required>
      </div>
      <button type="submit" class="btn btn-register text-white">Criar Conta</button>
      <div id="cadastroMessage" class="mt-3 text-center"></div>
    </form>
    <div class="text-center mt-3">
      <a href="login.html" class="text-danger">Já tem conta? Faça login</a><br>
      <a href="index.html" class="text-muted">← Voltar ao site</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
