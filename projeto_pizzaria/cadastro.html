<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Sabor Divino</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body {
  background: linear-gradient(135deg, #1a1a1a 0%, #8B0000 100%);
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
}
.register-container {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.register-card {
  background: rgba(255,255,255,0.95);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 500px;
  border-top: 5px solid #d9534f;
}
.register-card h2 { color: #8B0000; text-align: center; margin-bottom: 30px; font-weight: 700; }
.form-control { border-radius: 10px; padding: 12px; }
.btn-register {
  background: linear-gradient(90deg, #8B0000, #d9534f);
  border: none;
  padding: 12px;
  font-weight: bold;
  width: 100%;
  border-radius: 10px;
  color: white;
}
</style>
</head>
<body>
<div class="register-container">
  <div class="register-card">
    <h2><i class="fas fa-user-plus"></i> Criar Conta</h2>
    <form id="cadastroForm">
      <div class="mb-3"><label class="form-label">Nome Completo</label><input type="text" class="form-control" id="nome" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required></div>
      <div class="mb-3"><label class="form-label">Usuário</label><input type="text" class="form-control" id="newUsername" required></div>
      <div class="mb-3"><label class="form-label">Senha</label><input type="password" class="form-control" id="newPassword" required></div>
      <div class="mb-3"><label class="form-label">Confirmar Senha</label><input type="password" class="form-control" id="confirmPassword" required></div>
      <button type="submit" class="btn-register">Cadastrar</button>
      <div id="cadastroMessage" class="mt-3 text-center"></div>
    </form>
    <div class="text-center mt-3"><a href="login.html" class="text-danger">Já tem conta? Login</a> | <a href="index.html" class="text-muted">Voltar</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/script.js"></script>
</body>
</html>
