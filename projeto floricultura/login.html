<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BellaFlor</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="img/logo.png" alt="BellaFlor">
                <h2>BellaFlor</h2>
            </div>
            <h3>Bem-vindo de volta</h3>
            <p class="auth-subtitle">Acesse sua conta para continuar</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="login-email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                    <span class="toggle-password" onclick="togglePassword('login-password')">
                        <i class="far fa-eye"></i>
                    </span>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            
            <div class="auth-divider">
                <span>ou</span>
            </div>
            
            <button class="btn-google">
                <i class="fab fa-google"></i> Continuar com Google
            </button>
            
            <p class="auth-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Voltar ao site</a>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
