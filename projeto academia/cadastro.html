<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronFit | Cadastro de Aluno</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cadastro-container {
            max-width: 700px;
            margin: 140px auto 80px;
            padding: 0 24px;
        }
        .form-card {
            background: white;
            border-radius: 32px;
            padding: 48px;
            box-shadow: var(--shadow);
        }
        .form-card h2 {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .form-card p {
            color: var(--text-gray);
            margin-bottom: 32px;
        }
        .input-icon {
            position: relative;
            margin-bottom: 24px;
        }
        .input-icon i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        .input-icon input, .input-icon select {
            width: 100%;
            padding: 14px 14px 14px 46px;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            font-size: 1rem;
            transition: var(--transition);
        }
        .input-icon input:focus, .input-icon select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn-block {
            width: 100%;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <div class="logo-area">
                <img src="img/logo.png" alt="Logo" class="logo-img">
                <span class="logo-text">IronFit</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">Início</a>
                <a href="admin.html">Admin</a>
                <a href="cadastro.html" class="active">Cadastro</a>
            </nav>
        </div>
    </header>

    <div class="cadastro-container">
        <div class="form-card">
            <h2><i class="fas fa-user-plus" style="color: var(--primary);"></i> Comece sua jornada</h2>
            <p>Preencha os dados e garantimos um retorno rápido para seu plano experimental</p>
            
            <form id="cadastroForm">
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="nome" placeholder="Nome completo" required>
                </div>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Seu melhor e-mail" required>
                </div>
                <div class="input-icon">
                    <i class="fas fa-phone"></i>
                    <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>
                </div>
                <div class="input-icon">
                    <i class="fas fa-calendar-alt"></i>
                    <select id="planoInteresse">
                        <option value="Mensal">Plano Mensal - R$99/mês</option>
                        <option value="Semestral">Plano Semestral - R$89/mês</option>
                        <option value="Anual">Plano Anual - R$79/mês</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary btn-block">Enviar solicitação <i class="fas fa-arrow-right"></i></button>
            </form>
            <p style="margin-top: 24px; text-align: center; font-size: 0.85rem;"><i class="fas fa-shield-alt"></i> Seus dados estão seguros</p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
