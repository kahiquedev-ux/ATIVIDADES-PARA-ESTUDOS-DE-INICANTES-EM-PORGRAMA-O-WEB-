<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro - Fashion Store</title>
<!-- Link para o CSS do Bootstrap -->
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
rel="stylesheet">
<!-- Link para o nosso CSS personalizado -->
<link rel="stylesheet" href="./css/style.css">
<style>
body {
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #f0f2f5;
}
.cadastro-container {
max-width: 500px;
padding: 40px;
border-radius: 10px;
box-shadow: 0 4px 20px rgba(0,0,0,0.1);
background-color: #fff;
}
.cadastro-container h2 {
color: #343a40;
margin-bottom: 30px;
font-weight: 700;
}
.btn-primary {
background-color: #e83e8c;
border-color: #e83e8c;
}
.btn-primary:hover {
background-color: #d63384;
border-color: #d63384;
}
</style>
</head>
<body>
<div class="cadastro-container">
<h2 class="text-center">Crie sua conta</h2>
<form id="cadastroForm">
<div class="mb-3">
<label for="nome" class="form-label">Nome Completo</label>
<input type="text" class="form-control" id="nome" required>
</div>
<div class="mb-3">
<label for="email" class="form-label">E-mail</label>
<input type="email" class="form-control" id="email"
required>
</div>
<div class="mb-3">
<label for="newUsername" class="form-label">Usuário</label>
<input type="text" class="form-control" id="newUsername"
required>
</div>
<div class="mb-3">
<label for="newPassword" class="form-label">Senha</label>
<input type="password" class="form-control" id="newPassword"
required>
</div>
<div class="mb-3">
<label for="confirmPassword" class="form-label">Confirmar
Senha</label>
<input type="password" class="form-control"
id="confirmPassword" required>
</div>
<button type="submit" class="btn btn-primary w-100 mt3">Cadastrar</button>
<p class="text-center mt-4">Já tem uma conta? <a
href="login.html" class="text-primary">Faça Login</a></p>
<div id="cadastroMessage" class="mt-3 text-center text-danger">
</div>
</form>
</div>
<!-- Link para o JS do Bootstrap -->
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min
</script>
<!-- Nosso script para a lógica de cadastro -->
<script src="./js/script.js"></script>
</body>
</html>
