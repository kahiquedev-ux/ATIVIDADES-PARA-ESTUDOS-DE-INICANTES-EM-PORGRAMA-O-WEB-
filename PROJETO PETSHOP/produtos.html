<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | PetShop Plus+</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .products-page {
            background: #f8f9fa;
            min-height: 100vh;
        }
        .products-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding: 30px 0;
        }
        /* FILTROS SIDEBAR */
        .filters-sidebar {
            background: white;
            border-radius: 16px;
            padding: 24px;
            position: sticky;
            top: 100px;
            height: fit-content;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .filters-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .filters-header h3 {
            font-size: 18px;
            margin: 0;
        }
        .clear-filters {
            background: none;
            border: none;
            color: #ff6b35;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-group {
            margin-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 20px;
        }
        .filter-group h4 {
            font-size: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filter-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .filter-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }
        .price-range {
            padding: 0 10px;
        }
        .price-range input {
            width: 100%;
            margin: 15px 0;
        }
        .price-values {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #666;
        }
        .btn-apply-filters {
            width: 100%;
            padding: 12px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }
        /* PRODUTOS MAIN */
        .products-main {
            background: transparent;
        }
        .products-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .products-count {
            color: #666;
            font-size: 14px;
        }
        .sort-select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        .products-grid-page {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .product-card-page {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
        }
        .product-card-page:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.1);
        }
        .product-discount {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #dc2626;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            z-index: 2;
        }
        .product-image-page {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fafafa;
            padding: 20px;
        }
        .product-image-page img {
            max-width: 80%;
            max-height: 150px;
            object-fit: contain;
        }
        .product-info-page {
            padding: 16px;
        }
        .product-brand {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
        }
        .product-name-page {
            font-size: 15px;
            font-weight: 600;
            margin: 8px 0;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
        }
        .product-price-page {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 10px 0;
        }
        .price-current {
            font-size: 22px;
            font-weight: 800;
            color: #ff6b35;
        }
        .price-old-page {
            font-size: 13px;
            color: #999;
            text-decoration: line-through;
        }
        .product-installments {
            font-size: 11px;
            color: #28a745;
            margin-bottom: 12px;
        }
        .btn-add-page {
            width: 100%;
            padding: 12px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-add-page:hover {
            background: #e55a2b;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
        }
        .pagination button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pagination button.active {
            background: #ff6b35;
            color: white;
            border-color: #ff6b35;
        }
        .no-results {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 16px;
        }
        @media (max-width: 768px) {
            .products-layout {
                grid-template-columns: 1fr;
            }
            .filters-sidebar {
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
<div class="products-page">
    <!-- Header igual ao index -->
    <div class="top-bar-super">
        <div class="container">
            <div class="top-left"><i class="fas fa-truck-fast"></i> Frete Grátis acima de R$199</div>
            <div class="top-right"><a href="tel:1133334444"><i class="fas fa-phone"></i> (11) 3333-4444</a></div>
        </div>
    </div>
    
    <header class="main-header">
        <div class="container">
            <div class="logo-area">
                <img src="img/logo.png" alt="Logo" class="main-logo">
                <div class="logo-text"><h1>PetShop <span>Plus+</span></h1></div>
            </div>
            <div class="search-area">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="search-produtos" placeholder="Buscar produtos..." autocomplete="off">
                </div>
            </div>
            <div class="header-actions">
                <a href="login.html" class="action-link"><i class="fas fa-user-circle"></i><span>Minha Conta</span></a>
                <div class="cart-wrapper" id="cart-wrapper-prod">
                    <button class="cart-trigger" onclick="abrirCarrinhoModal()">
                        <i class="fas fa-shopping-cart"></i><span>Carrinho</span>
                        <span class="cart-badge" id="cart-count-prod">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <div class="container">
        <div class="products-layout">
            <!-- FILTROS LATERAL -->
            <aside class="filters-sidebar" id="filters-sidebar">
                <div class="filters-header">
                    <h3><i class="fas fa-filter"></i> Filtros</h3>
                    <button class="clear-filters" onclick="limparTodosFiltros()">Limpar tudo</button>
                </div>
                
                <div class="filter-group">
                    <h4><i class="fas fa-tag"></i> Categorias</h4>
                    <div class="filter-options" id="categorias-filtro"></div>
                </div>
                
                <div class="filter-group">
                    <h4><i class="fas fa-dollar-sign"></i> Faixa de Preço</h4>
                    <div class="price-range">
                        <input type="range" id="preco-min-range" min="0" max="500" value="0">
                        <input type="range" id="preco-max-range" min="0" max="500" value="500">
                        <div class="price-values">
                            <span>R$ <span id="preco-min-val">0</span></span>
                            <span>R$ <span id="preco-max-val">500</span></span>
                        </div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <h4><i class="fas fa-star"></i> Avaliação</h4>
                    <div class="filter-options">
                        <label><input type="radio" name="rating" value="0"> Todas</label>
                        <label><input type="radio" name="rating" value="4"> ★★★★☆ e acima</label>
                        <label><input type="radio" name="rating" value="3"> ★★★☆☆ e acima</label>
                    </div>
                </div>
                
                <div class="filter-group">
                    <h4><i class="fas fa-box"></i> Estoque</h4>
                    <div class="filter-options">
                        <label><input type="checkbox" id="in-stock-only"> Apenas em estoque</label>
                    </div>
                </div>
                
                <button class="btn-apply-filters" onclick="aplicarFiltrosCompletos()">
                    <i class="fas fa-search"></i> Aplicar Filtros
                </button>
            </aside>
            
            <!-- PRODUTOS MAIN -->
            <main class="products-main">
                <div class="products-header-bar">
                    <div class="products-count" id="products-count">Mostrando 30 produtos</div>
                    <select class="sort-select" id="sort-select" onchange="ordenarProdutos()">
                        <option value="relevance">Relevância</option>
                        <option value="price-asc">Menor preço</option>
                        <option value="price-desc">Maior preço</option>
                        <option value="name-asc">Nome A-Z</option>
                        <option value="name-desc">Nome Z-A</option>
                        <option value="best-seller">Mais vendidos</option>
                    </select>
                </div>
                
                <div id="produtos-container" class="products-grid-page"></div>
                
                <div class="pagination" id="pagination"></div>
            </main>
        </div>
    </div>
    
    <!-- CARRINHO MODAL -->
    <div id="cart-modal" class="cart-modal">
        <div class="cart-modal-content">
            <div class="cart-modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Meu Carrinho</h3>
                <button class="close-cart" onclick="fecharCarrinhoModal()">&times;</button>
            </div>
            <div class="cart-modal-body" id="cart-modal-body"></div>
            <div class="cart-modal-footer">
                <div class="frete-calc">
                    <h4>Calcular Frete</h4>
                    <div class="frete-input-group">
                        <input type="text" id="modal-cep" placeholder="Digite seu CEP" maxlength="9">
                        <button onclick="calcularFreteModal()">Calcular</button>
                    </div>
                    <div id="modal-frete-resultado"></div>
                </div>
                <div class="cart-total">
                    <span>Total:</span>
                    <strong id="cart-modal-total">R$ 0,00</strong>
                </div>
                <button class="btn-finalizar-modal" onclick="finalizarCompraModal()">
                    <i class="fas fa-credit-card"></i> Finalizar Compra
                </button>
            </div>
        </div>
    </div>
    
    <a href="index.html" class="back-to-home" style="position:fixed; bottom:20px; left:20px; background:#ff6b35; color:white; padding:12px 20px; border-radius:50px; text-decoration:none; z-index:100;">
        <i class="fas fa-home"></i> Voltar
    </a>
</div>

<script src="js/script.js"></script>
<script>
    // Variáveis globais
    let todosProdutos = [];
    let produtosFiltrados = [];
    let currentPage = 1;
    const itemsPerPage = 12;
    
    // Inicializar produtos
    function initProdutos() {
        if(window.produtosArray && window.produtosArray.length > 0) {
            todosProdutos = window.produtosArray;
        } else {
            // Criar 30 produtos como fallback
            const categorias = ['Ração Premium', 'Brinquedos', 'Higiene', 'Acessórios', 'Petiscos', 'Medicamentos'];
            const marcas = ['Royal Canin', 'Pedigree', 'Premier', 'Whiskas', 'Friskies', 'PetLove'];
            
            for(let i = 1; i <= 30; i++) {
                const categoria = categorias[i % categorias.length];
                const preco = (Math.random() * 250 + 15).toFixed(2);
                const desconto = Math.random() > 0.7 ? Math.floor(Math.random() * 30) + 5 : 0;
                const precoComDesconto = desconto > 0 ? (preco * (1 - desconto/100)).toFixed(2) : null;
                
                todosProdutos.push({
                    id: i,
                    nome: `${categoria} ${i} - Produto Premium`,
                    categoria: categoria,
                    marca: marcas[i % marcas.length],
                    preco_original: parseFloat(preco),
                    preco_atual: precoComDesconto ? parseFloat(precoComDesconto) : parseFloat(preco),
                    desconto: desconto,
                    imagem: 'img/produtos.png',
                    avaliacao: (Math.random() * 2 + 3).toFixed(1),
                    avaliacoes_count: Math.floor(Math.random() * 500) + 10,
                    estoque: Math.floor(Math.random() * 100) + 1,
                    vendidos: Math.floor(Math.random() * 1000),
                    descricao: 'Produto de alta qualidade para seu pet'
                });
            }
        }
        produtosFiltrados = [...todosProdutos];
        renderizarCategoriasFiltro();
        atualizarContadorProdutos();
        renderizarProdutosPaginados();
    }
    
    function renderizarCategoriasFiltro() {
        const categorias = [...new Set(todosProdutos.map(p => p.categoria))];
        const container = document.getElementById('categorias-filtro');
        container.innerHTML = categorias.map(cat => `
            <label>
                <input type="checkbox" class="cat-filter" value="${cat}"> ${cat}
            </label>
        `).join('');
    }
    
    function aplicarFiltrosCompletos() {
        let filtrados = [...todosProdutos];
        
        // Filtro de categoria
        const catsSelecionadas = Array.from(document.querySelectorAll('.cat-filter:checked')).map(cb => cb.value);
        if(catsSelecionadas.length > 0) {
            filtrados = filtrados.filter(p => catsSelecionadas.includes(p.categoria));
        }
        
        // Filtro de preço
        const precoMin = parseFloat(document.getElementById('preco-min-range').value);
        const precoMax = parseFloat(document.getElementById('preco-max-range').value);
        filtrados = filtrados.filter(p => p.preco_atual >= precoMin && p.preco_atual <= precoMax);
        
        // Filtro de avaliação
        const ratingSelected = document.querySelector('input[name="rating"]:checked');
        if(ratingSelected && ratingSelected.value != '0') {
            const minRating = parseFloat(ratingSelected.value);
            filtrados = filtrados.filter(p => p.avaliacao >= minRating);
        }
        
        // Filtro apenas em estoque
        const inStockOnly = document.getElementById('in-stock-only').checked;
        if(inStockOnly) {
            filtrados = filtrados.filter(p => p.estoque > 0);
        }
        
        // Filtro de busca
        const searchTerm = document.getElementById('search-produtos').value.toLowerCase();
        if(searchTerm) {
            filtrados = filtrados.filter(p => p.nome.toLowerCase().includes(searchTerm) || p.categoria.toLowerCase().includes(searchTerm));
        }
        
        produtosFiltrados = filtrados;
        currentPage = 1;
        atualizarContadorProdutos();
        renderizarProdutosPaginados();
    }
    
    function ordenarProdutos() {
        const sortType = document.getElementById('sort-select').value;
        
        switch(sortType) {
            case 'price-asc':
                produtosFiltrados.sort((a,b) => a.preco_atual - b.preco_atual);
                break;
            case 'price-desc':
                produtosFiltrados.sort((a,b) => b.preco_atual - a.preco_atual);
                break;
            case 'name-asc':
                produtosFiltrados.sort((a,b) => a.nome.localeCompare(b.nome));
                break;
            case 'name-desc':
                produtosFiltrados.sort((a,b) => b.nome.localeCompare(a.nome));
                break;
            case 'best-seller':
                produtosFiltrados.sort((a,b) => b.vendidos - a.vendidos);
                break;
            default:
                produtosFiltrados.sort((a,b) => a.id - b.id);
        }
        
        renderizarProdutosPaginados();
    }
    
    function renderizarProdutosPaginados() {
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const paginatedProducts = produtosFiltrados.slice(start, end);
        const container = document.getElementById('produtos-container');
        
        if(paginatedProducts.length === 0) {
            container.innerHTML = '<div class="no-results"><i class="fas fa-search fa-3x" style="color:#ccc"></i><h3>Nenhum produto encontrado</h3><p>Tente outros filtros ou termos de busca</p></div>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        
        container.innerHTML = paginatedProducts.map(p => `
            <div class="product-card-page">
                ${p.desconto > 0 ? `<div class="product-discount">-${p.desconto}%</div>` : ''}
                <div class="product-image-page">
                    <img src="${p.imagem}" alt="${p.nome}">
                </div>
                <div class="product-info-page">
                    <div class="product-brand">${p.marca}</div>
                    <div class="product-name-page">${p.nome}</div>
                    <div class="product-price-page">
                        <span class="price-current">R$ ${p.preco_atual.toFixed(2)}</span>
                        ${p.desconto > 0 ? `<span class="price-old-page">R$ ${p.preco_original.toFixed(2)}</span>` : ''}
                    </div>
                    <div class="product-installments">
                        ${(p.preco_atual / 3).toFixed(2)} sem juros no cartão
                    </div>
                    <div class="product-rating">
                        <span class="stars">${'★'.repeat(Math.floor(p.avaliacao))}${'☆'.repeat(5-Math.floor(p.avaliacao))}</span>
                        <span>(${p.avaliacoes_count})</span>
                    </div>
                    <button class="btn-add-page" onclick="adicionarAoCarrinhoGlobal(${p.id})">
                        <i class="fas fa-cart-plus"></i> Adicionar
                    </button>
                </div>
            </div>
        `).join('');
        
        // Renderizar paginação
        const totalPages = Math.ceil(produtosFiltrados.length / itemsPerPage);
        const paginationContainer = document.getElementById('pagination');
        
        let paginationHtml = `<button onclick="mudarPagina(${currentPage-1})" ${currentPage === 1 ? 'disabled' : ''}>&laquo;</button>`;
        
        for(let i = 1; i <= Math.min(totalPages, 5); i++) {
            paginationHtml += `<button class="${i === currentPage ? 'active' : ''}" onclick="mudarPagina(${i})">${i}</button>`;
        }
        
        if(totalPages > 5) {
            paginationHtml += `<span>...</span><button onclick="mudarPagina(${totalPages})">${totalPages}</button>`;
        }
        
        paginationHtml += `<button onclick="mudarPagina(${currentPage+1})" ${currentPage === totalPages ? 'disabled' : ''}>&raquo;</button>`;
        
        paginationContainer.innerHTML = paginationHtml;
    }
    
    function mudarPagina(page) {
        const totalPages = Math.ceil(produtosFiltrados.length / itemsPerPage);
        if(page < 1 || page > totalPages) return;
        currentPage = page;
        renderizarProdutosPaginados();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function atualizarContadorProdutos() {
        document.getElementById('products-count').innerHTML = `Mostrando ${produtosFiltrados.length} de ${todosProdutos.length} produtos`;
    }
    
    function limparTodosFiltros() {
        document.querySelectorAll('.cat-filter').forEach(cb => cb.checked = false);
        document.getElementById('preco-min-range').value = 0;
        document.getElementById('preco-max-range').value = 500;
        document.getElementById('preco-min-val').innerText = '0';
        document.getElementById('preco-max-val').innerText = '500';
        document.querySelector('input[name="rating"][value="0"]').checked = true;
        document.getElementById('in-stock-only').checked = false;
        document.getElementById('search-produtos').value = '';
        aplicarFiltrosCompletos();
    }
    
    // Event listeners
    document.getElementById('preco-min-range').addEventListener('input', (e) => {
        document.getElementById('preco-min-val').innerText = e.target.value;
    });
    document.getElementById('preco-max-range').addEventListener('input', (e) => {
        document.getElementById('preco-max-val').innerText = e.target.value;
    });
    
    document.getElementById('search-produtos').addEventListener('keyup', (e) => {
        if(e.key === 'Enter') aplicarFiltrosCompletos();
    });
    
    // Carrinho Modal
    function abrirCarrinhoModal() {
        document.getElementById('cart-modal').style.display = 'flex';
        atualizarModalCarrinho();
    }
    
    function fecharCarrinhoModal() {
        document.getElementById('cart-modal').style.display = 'none';
    }
    
    function atualizarModalCarrinho() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
        const container = document.getElementById('cart-modal-body');
        const totalSpan = document.getElementById('cart-modal-total');
        
        if(carrinho.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px;"><i class="fas fa-shopping-cart fa-3x" style="color:#ccc"></i><p>Seu carrinho está vazio</p></div>';
            totalSpan.innerText = 'R$ 0,00';
            return;
        }
        
        let total = 0;
        container.innerHTML = carrinho.map(item => {
            total += item.preco * item.quantidade;
            return `
                <div style="display:flex; gap:15px; margin-bottom:15px; padding:10px; border-bottom:1px solid #eee;">
                    <img src="${item.imagem}" width="60" style="object-fit:contain">
                    <div style="flex:1">
                        <strong>${item.nome}</strong>
                        <div>R$ ${item.preco.toFixed(2)}</div>
                        <div style="display:flex; align-items:center; gap:10px; margin-top:8px;">
                            <button onclick="alterarQtdModal(${item.id}, -1)">-</button>
                            <span>${item.quantidade}</span>
                            <button onclick="alterarQtdModal(${item.id}, 1)">+</button>
                            <button onclick="removerItemModal(${item.id})" style="color:#dc2626">&times; Remover</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        totalSpan.innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('cart-count-prod').innerText = carrinho.reduce((s,i) => s + i.quantidade, 0);
    }
    
    function adicionarAoCarrinhoGlobal(id) {
        const produto = todosProdutos.find(p => p.id === id);
        if(!produto) return;
        
        let carrinho = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
        const existente = carrinho.find(i => i.id === id);
        
        if(existente) {
            existente.quantidade++;
        } else {
            carrinho.push({
                id: produto.id,
                nome: produto.nome,
                preco: produto.preco_atual,
                imagem: produto.imagem,
                quantidade: 1
            });
        }
        
        localStorage.setItem('carrinho_produtos', JSON.stringify(carrinho));
        atualizarModalCarrinho();
        
        // Animação feedback
        const btn = event.target;
        btn.innerHTML = '<i class="fas fa-check"></i> Adicionado!';
        setTimeout(() => {
            btn.innerHTML = '<i class="fas fa-cart-plus"></i> Adicionar';
        }, 1000);
    }
    
    function alterarQtdModal(id, delta) {
        let carrinho = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
        const item = carrinho.find(i => i.id === id);
        if(item) {
            item.quantidade += delta;
            if(item.quantidade <= 0) {
                carrinho = carrinho.filter(i => i.id !== id);
            }
            localStorage.setItem('carrinho_produtos', JSON.stringify(carrinho));
            atualizarModalCarrinho();
        }
    }
    
    function removerItemModal(id) {
        let carrinho = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
        carrinho = carrinho.filter(i => i.id !== id);
        localStorage.setItem('carrinho_produtos', JSON.stringify(carrinho));
        atualizarModalCarrinho();
    }
    
    function calcularFreteModal() {
        const cep = document.getElementById('modal-cep').value;
        const resultadoDiv = document.getElementById('modal-frete-resultado');
        
        if(!cep || cep.length < 8) {
            resultadoDiv.innerHTML = '<span style="color:#dc2626">Digite um CEP válido</span>';
            return;
        }
        
        // Simulação de cálculo de frete
        const valorFrete = (Math.random() * 30 + 10).toFixed(2);
        const prazo = Math.floor(Math.random() * 5) + 1;
        
        resultadoDiv.innerHTML = `
            <div style="margin-top:10px; padding:10px; background:#f0fdf4; border-radius:8px;">
                <i class="fas fa-truck"></i> Frete: R$ ${valorFrete}<br>
                <i class="fas fa-calendar"></i> Prazo: ${prazo} dias úteis
            </div>
        `;
    }
    
    function finalizarCompraModal() {
        const carrinho = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
        if(carrinho.length === 0) {
            alert('Seu carrinho está vazio!');
            return;
        }
        
        alert('Pedido finalizado com sucesso! 🎉\n\nEm breve você receberá a confirmação por e-mail.');
        localStorage.removeItem('carrinho_produtos');
        atualizarModalCarrinho();
        fecharCarrinhoModal();
        location.reload();
    }
    
    // Inicializar
    initProdutos();
    
    // Atualizar contador do carrinho no load
    const carrinhoInicial = JSON.parse(localStorage.getItem('carrinho_produtos')) || [];
    document.getElementById('cart-count-prod').innerText = carrinhoInicial.reduce((s,i) => s + i.quantidade, 0);
</script>
</body>
</html>
